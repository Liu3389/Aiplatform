# ============================================
# 凌点 AI 网关 - 后端服务栈
# 包含: MySQL + Redis + SpringBoot 后端
# 用途: 单独部署后端（前端另行部署）
# 启动: docker compose -f docker-compose.backend.yml up -d
# ============================================

services:
  mysql:
    image: mysql:8.0
    container_name: lingdian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_gateway}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Aiplatform-demo/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Aiplatform-demo/src/main/resources/sql/testdata.sql:/docker-entrypoint-initdb.d/02-testdata.sql
      - ./Aiplatform-demo/src/main/resources/sql/migration.sql:/docker-entrypoint-initdb.d/03-migration.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - lingdian-net

  redis:
    image: redis:7-alpine
    container_name: lingdian-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lingdian-net

  ai-gateway-app:
    build:
      context: ./Aiplatform-demo
      dockerfile: docker/Dockerfile
    image: lingdian/backend:latest
    container_name: lingdian-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - lingdian-net

volumes:
  mysql_data:
  redis_data:

networks:
  lingdian-net:
    driver: bridge
