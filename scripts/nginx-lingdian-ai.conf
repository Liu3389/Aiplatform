# =============================================================================
# 凌点 AI 平台 - Nginx 反向代理配置 (域名 lingdian-ai.top)
# 80  -> 301 跳转 HTTPS
# 443 -> SSL + 反代: /api/ 后端容器(8080, SSE流式) + / 前端容器(8088)
# 原微信支付配置已备份为 lingdian-ai.conf.wechatpay.bak
# =============================================================================
# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name lingdian-ai.top www.lingdian-ai.top;
    return 301 https://$host$request_uri;
}

# HTTPS 凌点AI主站
server {
    listen 443 ssl http2;
    server_name lingdian-ai.top www.lingdian-ai.top;

    ssl_certificate     /etc/nginx/ssl/lingdian-ai.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/lingdian-ai.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 支持材料/文件上传
    client_max_body_size 50m;

    # 本地文件存储访问（OSS 降级时通过 /api/uploads/ 路径访问本地文件，启用缓冲提升下载性能）
    location /api/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文件下载: 启用缓冲（与 SSE 流式对话的 proxy_buffering off 区分开）
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 凌点AI后端 API (含 /api/chat/stream SSE 流式对话, 必须关闭缓冲)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持: 关闭缓冲/缓存, 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # 凌点AI前端 (容器内 nginx 服务静态文件 + SPA 路由)
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
