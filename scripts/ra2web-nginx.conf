# RA2Web static server. Mount this container at /hj666/ on the platform host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    location ~* \.(js|css|wasm|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|ini|csf|mix)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
