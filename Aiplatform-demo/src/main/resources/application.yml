server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-gateway-platform

  ai:
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_gateway}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1800000
      pool-name: AiGatewayHikariCP
      connection-test-query: SELECT 1
      validation-timeout: 3000
      leak-detection-threshold: 60000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-wait: 3000ms
          max-idle: 20
          min-idle: 10
        shutdown-timeout: 200ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ai.gateway.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rate-limit:
  default-rate: 100
  user-max-requests: 60
  lua-script: classpath:lua/rate_limit.lua

billing:
  lua-script: classpath:lua/billing.lua
  pre-deduct-ratio: 1.2

# 应用配置
app:
  init-test-data: false  # 是否每次启动时重置数据库并生成测试数据（默认false，开发时可设为true）
  secondary-password: ${SECONDARY_PASSWORD:}  # 系统控制二级密码（管理员容器启停功能）
  messaging:
    rabbit-enabled: ${RABBITMQ_ENABLED:false} # 本地无 RabbitMQ 时降级到线程池；部署环境显式开启
    file-parse-queue: ${FILE_PARSE_QUEUE:ai.file.parse}
    settlement-queue: ${BILLING_SETTLEMENT_QUEUE:ai.billing.settlement}
  storage:
    local-path: ${APP_STORAGE_LOCAL_PATH:./uploads}  # 本地文件存储目录（Docker容器挂载到宿主机 ./uploads）
    prefer-local: ${APP_STORAGE_PREFER_LOCAL:true}  # OSS 不可用时本地优先，避免上传先等待 OSS 超时
  verification:
    # External delivery is disabled unless explicitly configured; local capture is only for the isolated local stack.
    delivery-mode: ${VERIFICATION_DELIVERY_MODE:disabled}
    allow-local-capture: ${VERIFICATION_ALLOW_LOCAL_CAPTURE:false}
    sms:
      url: ${VERIFICATION_SMS_URL:}
      token: ${VERIFICATION_SMS_TOKEN:}
      template-id: ${VERIFICATION_SMS_TEMPLATE_ID:}
    email:
      from: ${VERIFICATION_EMAIL_FROM:${SPRING_MAIL_USERNAME:}}

# API 加密配置
api:
  encryption:
    key: ${API_ENCRYPTION_KEY:}  # AES-256 密钥（Base64编码），必须由部署环境注入

# CORS 跨域配置
cors:
  allowed-origins: ${ALLOWED_ORIGINS:*}  # 允许的域名，多个用逗号分隔。生产环境建议明确指定域名

logging:
  level:
    root: WARN
    com.ai.gateway: INFO
    com.ai.gateway.mapper: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
  file:
    name: logs/ai-gateway.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","thread":"%thread","logger":"%logger{36}","msg":"%msg"}%n'
    file: '{"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","thread":"%thread","logger":"%logger{36}","msg":"%msg"}%n'


aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    domain: ${ALIYUN_OSS_DOMAIN:}

# ===== Knife4j / OpenAPI 3 文档配置 =====
springdoc:
  packages-to-scan: com.ai.gateway.controller
  show-actuator: false          # 不把 actuator 端点算进接口文档
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-footer: false

# 搜索引擎配置（联网搜索）
# auto 会按“已配置 SearXNG/Jina -> Bing -> 百度”依次回退；Jina 当前需要 API Key。
# engine: auto | bing | baidu | searxng | jina
searxng:
  base-url: ${SEARXNG_BASE_URL:http://localhost:8888}
  enabled: ${SEARXNG_ENABLED:true}
  engine: ${SEARXNG_ENGINE:auto}

# Jina AI 搜索（备选引擎，无需自建容器，但当前接口需要 API Key）
jina:
  base-url: ${JINA_BASE_URL:https://s.jina.ai}
  api-key: ${JINA_API_KEY:}
  enabled: ${JINA_ENABLED:true}

# Tavily Search（专为 LLM 设计的联网搜索，效果最接近 AI 平台；配置 tavily.api-key 后自动优先使用）
tavily:
  base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
  api-key: ${TAVILY_API_KEY:}
  enabled: ${TAVILY_ENABLED:true}
