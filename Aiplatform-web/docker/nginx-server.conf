proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:32m max_size=128m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    aio threads;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml;

    # Static HTML: never cache (force fresh load on every visit)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # JS/CSS: immutable cache (Vite generates unique hash filenames per build)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Images/fonts: short cache
    location ~* \.(svg|png|jpg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # API: proxy with keepalive connection pool + caching for read-heavy endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }

    # Cached API endpoints - model config list (rarely changes)
    location /api/model-config/ {
        proxy_pass http://127.0.0.1:8080/api/model-config/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$request_uri";
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
