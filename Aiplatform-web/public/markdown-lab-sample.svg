<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">AI renderer preview graphic</title>
  <desc id="desc">Four rounded bars represent Markdown renderer checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff" />
      <stop offset="1" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="640" height="240" rx="20" fill="url(#bg)" />
  <g fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">
    <text x="36" y="44">Renderer acceptance checks</text>
    <text x="48" y="208">Tables</text><text x="188" y="208">Code</text><text x="330" y="208">Math</text><text x="472" y="208">Charts</text>
  </g>
  <g fill="url(#bar)">
    <rect x="56" y="94" width="72" height="92" rx="12" />
    <rect x="196" y="68" width="72" height="118" rx="12" />
    <rect x="336" y="50" width="72" height="136" rx="12" />
    <rect x="476" y="80" width="72" height="106" rx="12" />
  </g>
  <path d="M36 187H590" stroke="#cbd5e1" stroke-width="2" />
</svg>
